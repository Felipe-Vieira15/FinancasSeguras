<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Finanças | Login</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Web Finanças</h1>
        <h3>Login</h3>
        <form id="loginForm" class="form">
            <div id="errorMessage" class="error-message"></div>

            <h1>Email:</h1>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required>
            
            <h1>Senha:</h1>
            <input type="password" id="password" name="senha" placeholder="Digite sua senha" required>
            
            <div class="buttons">
                <button type="button" onclick="window.location.href='../screens/home.html'">Entrar</button>
                <button type="button" onclick="window.location.href='../screens/register.html'">Cadastrar</button>
            </div>
        </form>
    </div>
    <div class="footer">
        <p>&copy; 2025 Web Finanças. Todos os direitos reservados.</p>
        <h3>Arthur | Felipe Vieira</h3>
    </div>
</body>
</html>
