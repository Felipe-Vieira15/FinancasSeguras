<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Finanças | Cadastro</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="container-register">
        <h1>Web Finanças</h1>
        <h3>Cadastre-se</h3>
        <form id="registerForm" class="form">
            <div id="errorMessage" class="error-message"></div>

            <h1>Nome Completo:</h1>
            <input type="text" id="name" name="nome" placeholder="Digite seu nome" required>

            <h1>CPF:</h1>
            <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" required>

            <h1>Email:</h1>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required>
            
            <h1>Senha:</h1>
            <input type="password" id="password" name="senha" placeholder="Crie uma senha" required>
            
            <h1>Confirme sua Senha:</h1>
            <input type="password" id="confirm_password" name="confirme_senha" placeholder="Confirme sua senha" required>
            
            <div class="buttons">
                <button type="submit">Cadastrar</button>
                <button type="button" onclick="window.location.href='login.html'">Voltar</button>
            </div>
        </form>
    </div>
    <div class="footer">
        <p>&copy; 2025 Web Finanças. Todos os direitos reservados.</p>
        <h3>Arthur | Felipe Vieira</h3>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            // Previne o envio padrão do formulário
            event.preventDefault();

            // Pega os valores dos campos
            const name = document.getElementById('name').value;
            const cpf = document.getElementById('cpf').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const errorMessageDiv = document.getElementById('errorMessage');

            // 1. Validação no Frontend: verifica se as senhas são iguais
            if (password !== confirmPassword) {
                errorMessageDiv.textContent = 'As senhas não coincidem!';
                return; // Para a execução
            }

            // 2. Envio para a API
            try {
                const response = await fetch('http://localhost:3000/register', { // <-- Altere a URL se necessário
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    // Monta o corpo da requisição com os dados esperados pela API
                    body: JSON.stringify({ name, cpf, email, password }),
                });

                const data = await response.json();

                // Verifica se o cadastro foi criado com sucesso (status 201)
                if (response.status === 201) {
                    errorMessageDiv.textContent = '';
                    alert(data.message); // Exibe "Usuario cadastrado com sucesso"
                    window.location.href = 'login.html'; // Redireciona para a tela de login
                } else {
                    // Exibe a mensagem de erro vinda do servidor (ex: "CPF já cadastrado")
                    errorMessageDiv.textContent = data.error || 'Ocorreu um erro ao cadastrar.';
                }

            } catch (error) {
                // Erro de conexão ou outro problema
                console.error('Erro ao cadastrar:', error);
                errorMessageDiv.textContent = 'Não foi possível conectar ao servidor.';
            }
        });
    </script>
</body>
</html>
